org.gradle.jvmargs=-Xmx4g -Xss8m -Dfile.encoding=UTF-8
# Compilateur Kotlin : pile plus grande (la fonction du tour de conversation est longue ; StackOverflowError sinon).
kotlin.daemon.jvmargs=-Xmx3g -Xss8m
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Version de base de l'app : la CI y ajoute le numéro de build (0.2.0.<n>) et un versionCode croissant.
appVersionName=0.3.0
appVersionCode=100
