# Publication manuelle seulement, avec confirmation explicite et signature propriétaire obligatoire.
# Aucun push (même sur main) ne déclenche une publication.
# Firebase reste facultatif ; les quatre secrets SIGNING_* sont obligatoires.
name: Android release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the signed Claydot release after owner device/provider acceptance"
        required: true
        type: boolean
        default: false

permissions:
  contents: write # créer le tag et la release

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    environment: claydot-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Paquets explicites : la liste par défaut contient « tools », absent des cmdline-tools récents
      # (sdkmanager échoue alors avant la compilation). Plateforme et build-tools viennent de Gradle.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          base=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)
          # versionCode doit toujours croître : 100 + numéro d'exécution du workflow.
          echo "VERSION_NAME=${base}.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "name=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Firebase (push notifications, optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            echo "PUSH_STATUS=enabled (Firebase)" >> "$GITHUB_ENV"
          else
            echo "PUSH_STATUS=disabled (no GOOGLE_SERVICES_JSON secret)" >> "$GITHUB_ENV"
          fi

      - name: Require release signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required release signing secret is missing: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STATUS=release key" >> "$GITHUB_ENV"

      - name: Tests and release build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          DEFAULT_GATEWAY_URL: ${{ vars.DEFAULT_GATEWAY_URL }}
          # La mise à jour intégrée suit les releases de ce dépôt (celui d'un fork, pour un fork).
          UPDATE_REPO: ${{ github.repository }}
        run: |
          chmod +x gradlew
          bash ./gradlew --no-daemon verifyReleaseSigning testDebugUnitTest lintDebug assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/claydot-${VERSION_NAME}.apk"
          (cd dist && sha256sum "claydot-${VERSION_NAME}.apk" > "claydot-${VERSION_NAME}.apk.sha256")

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Claydot ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.sha256
          body: |
            Android APK built from `${{ github.sha }}`.

            - Push notifications: ${{ env.PUSH_STATUS }}
            - Signature: ${{ env.SIGNING_STATUS }}

            Install it on your phone, then choose a direct API account or a Hermes gateway.
