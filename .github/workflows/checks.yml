# Vérifications continues (web, plugin gateway, app Android) : ne publie rien.
#
# Contrairement à « Android release » (qui ne tourne que sur main et publie un APK), ce workflow
# tourne à chaque push (toutes branches) et à chaque pull request, pour attraper les régressions
# du web et du plugin, que personne ne testait.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read # lecture seule : ce workflow ne publie rien

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Typecheck, tests and build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  server:
    name: Gateway plugin (tests + installer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # aiohttp pour le test d'intégration WebSocket (test_ws_guard) ; sans lui, il est sauté.
      - name: Unit and handshake tests
        run: |
          pip install aiohttp
          python -m unittest discover -s server/tests -v

      - name: Installer syntax
        run: bash -n server/install.sh

  android:
    name: Android (unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Paquets explicites : la liste par défaut contient « tools », absent des cmdline-tools récents
      # (sdkmanager échoue alors avant la compilation). Plateforme et build-tools viennent de Gradle.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      # Pas de signature ni de Firebase : comme un build local sans google-services.json.
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest
